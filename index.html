<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="a/icon.png"><link rel="apple-touch-icon" href="a/icon.png"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><script>window.LEGAL={"Privacy Policy": "<p>Privacy Policy<\/p> <h2>Austin Lifetime Dental LLLP Notice of Privacy Practices<\/h2> <strong>Updated: October 15, 2026<\/strong> THIS NOTICE DESCRIBES HOW MEDICAL INFORMATION ABOUT YOU MAY BE USED AND DISCLOSED AND HOW YOU CAN GET ACCESS TO THIS INFORMATION. PLEASE REVIEW IT CAREFULLY. <h2>I. Dental Practice Covered by this Notice<\/h2> <p>This Notice describes the privacy practices of Austin Lifetime Dental LLLP (&#8220;Dental Practice&#8221;). &#8220;We&#8221; and &#8220;our&#8221; means the Dental Practice. &#8220;You&#8221; and &#8220;your&#8221; means our patient.<\/p> <h2>II. How to Contact Us/Our Privacy Official<\/h2> <p>We take your privacy very seriously, so seriously we have appointed a privacy officer! If you have any questions or would like further information about this Notice, you can contact the Austin Lifetime Dental LLLP Privacy Official at:<\/p> <p>Samantha Watson<br />2206 West Parmer Lane<br />Austin, TX 78727<br />512-835-1924<br />frontdesk@lifetimedental.com<\/p> <h2>III. Our Promise to You and Our Legal Obligations<\/h2> <p>If you consent to receive SMS from Austin Lifetime Dental LLLP, you agree to receive appointment request SMS from us. Reply STOP to unsubscribe; Reply HELP for help; msg &amp; data rates may apply; Messaging frequency may vary. Visit (<a href=\"/privacy-policy/\" target=\"_blank\" rel=\"noopener\">lifetimedental.com/privacy-policy/<\/a>) to see our privacy policy and <a href=\"https://www.lifetimedental.com/terms-of-use-terms-of-service/\" target=\"_blank\" rel=\"noopener\">terms and conditions<\/a>.<\/p> <p>Eligibility and Authority<\/p> <p>You must be at least 18 years of age or older to access or use our Services. If you are accessing or using our Services on behalf of another person or entity, you represent that you are authorized to accept these Terms on that person or entity&#8217;s behalf and that the person or entity agrees to be responsible to us if you or the other person or entity violates these Terms<\/p> <p>We will not share your opt-in to an SMS campaign with any third party for purposes unrelated to providing you with the services of that campaign. We may share your Personal Data, including your SMS opt-in or consent status, with third parties that help us provide our messaging services, including but not limited to platform providers, phone companies, and any other vendors who assist us in the delivery of text messages. All of the above categories exclude text messaging originator opt-in data and consent; this information will not be shared with any third parties.<\/p> <p>No mobile information will be shared with third parties/affiliates for marketing/promotional purposes. Text message communications may contain protected health information and are handled in accordance with applicable privacy and security laws.<\/p> <p>The privacy of your health information is important to us. We understand that your health information is personal and we are committed to protecting it. This Notice describes how we may use and disclose your protected health information to carry out treatment, payment or health care operations and for other purposes that are permitted or required by law. It also describes your rights to access and control your protected health information. Protected health information is information about you, including demographic information, that may identify you and that relates to your past, present or future physical or mental health or condition and related health care services.<\/p> <p>We are required by law to:<\/p> <ul> <li>Maintain the privacy of your protected health information;<\/li> <li>Give you this Notice of our legal duties and privacy practices with respect to that information; and<\/li> <li>Abide by the terms of our Notice that is currently in effect.<\/li> <\/ul> <h2>IV. Last Revision Date<\/h2> <p>This Notice is effective as of the date listed above and applies to all protected health information maintained by Austin Lifetime Dental LLLP.<\/p> <h2>V. How We May Use or Disclose Your Health Information<\/h2> <p>The following examples describe different ways we may use or disclose your health information. These examples are not meant to be exhaustive. We are permitted by law to use and disclose your health information for the following purposes:<\/p> <ol> <li><b>Common Uses and Disclosures<\/b> <ol> <li><b>Treatment.<\/b> We may use your health information to provide you with dental treatment or services, such as cleaning or examining your teeth or performing dental procedures. We may disclose health information about you to dental specialists, physicians, or other health care professionals involved in your care.<\/li> <li><b>Payment.<\/b> We may use and disclose your health information to obtain payment from health plans and insurers for the care that we provide to you.<\/li> <li><b>Health Care Operations.<\/b> We may use and disclose health information about you in connection with health care operations necessary to run our practice, including review of our treatment and services, training, evaluating the performance of our staff and health care professionals, quality assurance, financial or billing audits, legal matters, and business planning and development.<\/li> <li><b>Appointment Reminders.<\/b> We may use or disclose your health information when contacting you to remind you of a dental appointment. We may contact you by using a postcard, letter, phone call, voice message, text or email.<\/li> <li><b>Treatment Alternatives and Health-Related Benefits and Services.<\/b> We may use and disclose your health information to tell you about treatment options or alternatives or health-related benefits and services that may be of interest to you.<\/li> <li><b>Disclosure to Family Members and Friends.<\/b> We may disclose your health information to a family member or friend who is involved with your care or payment for your care if you do not object or, if you are not present, we believe it is in your best interest to do so.<\/li> <li><b>Disclosure to Business Associates.<\/b> We may disclose your protected health information to our third-party service providers (called, &#8220;business associates&#8221;) that perform functions on our behalf or provide us with services if the information is necessary for such functions or services. For example, we may use a business associate to assist us in maintaining our practice management software. All of our business associates are obligated, under contract with us, to protect the privacy of your information and are not allowed to use or disclose any information other than as specified in our contract.<\/li> <\/ol> <\/li> <li><b>Less Common Uses and Disclosures<\/b> <ol> <li><b>Disclosures Required by Law.<\/b> We may disclose your health information to law enforcement or other government authorities only when such disclosure is permitted or required by law and all applicable conditions under HIPAA are met.<\/li> <li><b>Public Health Activities.<\/b> We may disclose patient health information for public health activities and purposes, which include: preventing or controlling disease, injury or disability; reporting births or deaths; reporting child abuse or neglect; reporting adverse reactions to medications or foods; reporting product defects; enabling product recalls; and notifying a person who may have been exposed to a disease or may be at risk for contracting or spreading a disease or condition.<\/li> <li><b>Victims of Abuse, Neglect or Domestic Violence.<\/b> We may disclose health information to the appropriate government authority about a patient whom we believe is a victim of abuse, neglect or domestic violence.<\/li> <li><b>Health Oversight Activities.<\/b> We may disclose patient health information to a health oversight agency for activities necessary for the government to provide appropriate oversight of the health care system, certain government benefit programs, and compliance with certain civil rights laws.<\/li> <li><b>Lawsuits and Legal Actions.<\/b> We may disclose your health information to law enforcement or other government authorities only when such disclosure is permitted or required by law and all applicable conditions under HIPAA are met.<\/li> <li><b>Law Enforcement Purposes.<\/b> We may disclose your health information to law enforcement or other government authorities only when such disclosure is permitted or required by law and all applicable conditions under HIPAA are met.<\/li> <li><b>Coroners, Medical Examiners and Funeral Directors.<\/b> We may disclose your health information to a coroner, medical examiner or funeral director to allow them to carry out their duties.<\/li> <li><b>Organ, Eye and Tissue Donation.<\/b> We may use or disclose your health information to organ procurement organizations or others that obtain, bank or transplant cadaveric organs, eyes or tissue for donation and transplant.<\/li> <li><b>Research Purposes.<\/b> We may use or disclose your information for research purposes pursuant to patient authorization waiver approval by an Institutional Review Board or Privacy Board.<\/li> <li><b>Serious Threat to Health or Safety.<\/b> We may use or disclose your health information if we believe it is necessary to do so to prevent or lessen a serious threat to anyone&#8217;s health or safety.<\/li> <li><b>Specialized Government Functions.<\/b> We may disclose your health information to the military (domestic or foreign) about its members or veterans, for national security and protective services for the President or other heads of state, to the government for security clearance reviews, and to a jail or prison about its inmates.<\/li> <li><b>Workers&#8217; Compensation.<\/b> We may disclose your health information to comply with workers&#8217; compensation laws or similar programs that provide benefits for work-related injuries or illness.<\/li> <\/ol> <\/li> <\/ol> <h2>VI. Your Written Authorization for Any Other Use or Disclosure of Your Health Information<\/h2> <p>Uses and disclosures of your protected health information that involve the release of psychotherapy notes (if any), marketing, sale of your protected health information, or other uses or disclosures not described in this notice will be made only with your written authorization, unless otherwise permitted or required by law. You may revoke this authorization at any time, in writing, except to the extent that this office has taken an action in reliance on the use of disclosure indicated in the authorization. If a use or disclosure of protected health information described above in this notice is prohibited or materially limited by other laws that apply to use, we intend to meet the requirements of the more stringent law.<\/p> <h2>VII. Your Rights with Respect to Your Health Information<\/h2> <p>You have the following rights with respect to certain health information that we have about you (information in a Designated Record Set as defined by HIPAA). To exercise any of these rights, you must submit a written request to our Privacy Official listed on the first page of this Notice.<\/p> <ol> <li><b>Right to Access and Review<\/b><br />You may request to access and review a copy of your health information. We may deny your request under certain circumstances. You will receive written notice of a denial and can appeal it. We will provide a copy of your health information in a format you request if it is readily producible. If not readily producible, we will provide it in a hard copy format or other format that is mutually agreeable. If your health information is included in an Electronic Health Record, you have the right to obtain a copy of it in an electronic format and to direct us to send it to the person or entity you designate in an electronic format. We may charge a reasonable fee to cover our cost to provide you with copies of your health information.<\/li> <li><b>Right to Amend<\/b><br />If you believe that your health information is incorrect or incomplete, you may request that we amend it. We may deny your request under certain circumstances. You will receive written notice of a denial and can file a statement of disagreement that will be included with your health information that you believe is incorrect or incomplete.<\/li> <li><b>Right to Restrict Use and Disclosure<\/b><br />You may request that we restrict uses of your health information to carry out treatment, payment, or health care operations or to your family member or friend involved in your care or the payment for your care. We may not (and are not required to) agree to your requested restrictions, with one exception: If you pay out of your pocket in full for a service you receive from us and you request that we not submit the claim for this service to your health insurer or health plan for reimbursement, we must honor that request.<\/li> <li><b>Right to Confidential Communications, Alternative Means and Locations<\/b><br />You may request to receive communications of health information by alternative means or at an alternative location. We will accommodate a request if it is reasonable and you indicate that communication by regular means could endanger you. When you submit a written request to the Privacy Official listed on the first page of this Notice, you need to provide an alternative method of contact or alternative address and indicate how payment for services will be handled.<\/li> <li><b>Right to an Accounting of Disclosure<\/b><br />You have a right to receive an accounting of disclosures of your health information for the six (6) years prior to the date that the accounting is requested except for disclosures to carry out treatment, payment, health care operations (and certain other exceptions as provided by HIPAA). The first accounting we provide in any 12-month period will be without charge to you. We may charge a reasonable fee to cover the cost for each subsequent request for an accounting within the same 12-month period. We will notify you in advance of this fee and you may choose to modify or withdraw your request at that time.<\/li> <li><b>Right to a Paper Copy of this Notice<\/b><br />You have the right to a paper copy of this Notice. You may ask us to give you a paper copy of the Notice at any time (even if you have agreed to receive the Notice electronically). To obtain a paper copy, ask the Privacy Official.<\/li> <li><b>Right to Receive Notification of a Security Breach<\/b><br />We are required by law to notify you if the privacy or security of your protected health information has been breached. A breach occurs when there has been an unauthorized use or disclosure under HIPAA that compromises the privacy or security of your health information. Breach notifications will be provided without unreasonable delay and no later than sixty (60) days following discovery of the breach. Any breach notification will include: (1) a brief description of what happened, including the date of the breach and the date of its discovery, if known; (2) a description of the types of information involved; (3) steps you should take to protect yourself from potential harm; and (4) a description of what we are doing to investigate the breach, mitigate potential harm, and prevent future breaches. All breach notifications will be made in accordance with applicable federal and state privacy and security laws.<\/li> <\/ol> <h2>VIII. Special Protections for HIV, Alcohol and Substance Abuse, Mental Health and Genetic Information<\/h2> <p>Certain health information may be subject to additional federal or state privacy protections that further limit how it may be used or disclosed. When more stringent privacy protections apply, we will comply with those requirements.<\/p> <p>Certain federal and state laws may require special privacy protections that restrict the use and disclosure of certain health information, including HIV-related information, alcohol and substance abuse information, mental health information, and genetic information. For example, a health plan is not permitted to use or disclose genetic information for underwriting purposes. Some parts of this HIPAA Notice of Privacy Practices may not apply to these types of information. If your treatment involves this information, you may contact our office for more information about these protections.<\/p> <h2>IX. Our Right to Change Our Privacy Practices and This Notice<\/h2> <p>We reserve the right to change the terms of this Notice at any time. Any change will apply to the health information we have about you or create or receive in the future. We will promptly revise the Notice when there is a material change to the uses or disclosures, individual&#8217;s rights, our legal duties, or other privacy practices discussed in this Notice. We will post the revised Notice on our website (if applicable) and in our office and will provide a copy of it to you on request. This Notice is effective as of February 16, 2026 and applies to all protected health information maintained by Austin Lifetime Dental LLLP.<\/p> <h2>X. How to Make Privacy Complaints<\/h2> <p>If you have any complaints about your privacy rights or how your health information has been used or disclosed, you may file a complaint with us by contacting our Privacy Official listed on the first page of this Notice.<br />You may also file a written complaint with the Secretary of the U.S. Department of Health and Human Services, Office for Civil Rights. We will not retaliate against you in any way if you choose to file a complaint.<\/p> ", "Terms of Use": "<h1>Terms of Use / Terms of Service<\/h  be reviewed right away.<\/p> <h2>SMS/Text Messaging Terms<\/h2> <p>If you consent to receive SMS messages from <strong>Austin Lifetime Dental, LLLP<\/strong>, you agree to receive appointment request messages, appointment reminders, and related practice communications from us.<\/p> <p>Message frequency may vary. Message and data rates may apply.<\/p> <p>Carriers are not liable for delayed or undelivered messages.<\/p> <p>Reply <strong>STOP<\/strong> to unsubscribe.<br>Reply <strong>HELP<\/strong> for help.<\/p> <p>Text message communications may contain protected health information and are handled in accordance with applicable privacy and security laws.<\/p> <p>We will not share your SMS opt-in or consent status with third parties for purposes unrelated to providing the services of that SMS campaign. We may share personal data, including SMS opt-in or consent status, with vendors who help us provide messaging services, such as messaging platform providers, phone companies, and other service providers that assist with text message delivery.<\/p> <p>Text messaging originator opt-in data and consent will not be shared with third parties for marketing purposes.<\/p> <p>Your use of SMS messaging is also subject to our Privacy Policy and Notice of Privacy Practices.<\/p> <h2>Privacy<\/h2> <p>Your privacy matters to us. Our use of personal information is described in our <a href=\"https://www.lifetimedental.com/privacy-policy/\" target=\"_blank\" rel=\"noopener\">Privacy Policy<\/a>. Our use and disclosure of protected health information is described in our Notice of Privacy Practices.<\/p> <p>Please review both documents carefully.<\/p> <h2>Website Content<\/h2> <p>The content on this website, including text, graphics, logos, images, videos, and layout, is owned by Austin Lifetime Dental, LLLP or used with permission. You may view the content for personal, non-commercial use.<\/p> <p>You may not copy, reproduce, distribute, modify, publish, or use website content for commercial purposes without written permission from Austin Lifetime Dental, LLLP.<\/p> <h2>Third-Party Links<\/h2> <p>This website may include links to third-party websites. These links are provided for convenience only. We do not control third-party websites and are not responsible for their content, privacy practices, or security.<\/p> <p>Visiting any third-party website is at your own risk.<\/p> <h2>No Guarantee of Results<\/h2> <p>Dental treatment results vary from person to person. Information on this website should not be understood as a promise or guarantee of a specific outcome.<\/p> <p>Your diagnosis, treatment options, timeline, and results depend on your oral health, medical history, habits, and other individual factors.<\/p> <h2>Accessibility<\/h2> <p>Austin Lifetime Dental LLLP is committed to making our website accessible. If you have trouble using this website or need help accessing information, please contact us.<\/p> <h2>Limitation of Liability<\/h2> <p>To the fullest extent allowed by law, Austin Lifetime Dental LLLP is not responsible for damages arising from your use of this website or inability to use this website.<\/p> <p>This includes direct, indirect, incidental, consequential, or punitive damages, even if we have been advised that such damages may occur.<\/p> <h2>No Warranties<\/h2> <p>This website is provided \u201cas is\u201d and \u201cas available.\u201d We do not guarantee that the website will always be available, error-free, secure, or free of viruses or harmful components.<\/p> <h2>Changes to These Terms<\/h2> <p>We may update these Terms of Use at any time. Updates will be posted on this page with a new \u201cUpdated\u201d date. Your continued use of the website means you accept the updated Terms.<\/p> <h2>Contact Us<\/h2> <p>If you have questions about these Terms of Use, please contact:<\/p> <p><strong>Austin Lifetime Dental, LLLP<\/strong><br>2206 West Parmer Lane<br>Austin, TX 78727<br>Phone: 512-835-1924<br><a href=\"https://www.lifetimedental.com/contact-us/\" target=\"_blank\" rel=\"noopener\">Or Contact Us<\/a><\/p> "};</script><title>Parmer Smile Consult v2</title>

.b-line{border-color:currentColor;background:transparent}
.b-ink{background:var(--ink);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,255,255,.12));backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 18px 40px -18px rgba(8,16,20,.55);border-radius:22px;color:#fff}
@media (max-width:640px){.row .btn{flex:1 1 100%}}

/* ---------- 01 nav ---------- */
.navdemo{position:relative;height:300px;overflow:hidden;background:var(--night)}
.navdemo>img{filter:brightness(.8)}
.pillnav{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px;background:rgba(245,246,245,.92);backdrop-filter:blur(14px);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);max-width:calc(100% - 24px)}
.pillnav button{border:0;background:transparent;border-radius:99px;height:42px;padding:0 12px;display:flex;align-items:center;gap:0;cursor:pointer;font-weight:600;font-size:14px;transition:background .3s,padding .3s}
.pillnav button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .4s cubic-bezier(.2,.9,.2,1),margin .3s}
.pillnav button[aria-current="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14);padding:0 16px}
.pillnav button[aria-current="true"] span{max-width:110px;margin-left:8px}
.pillnav .book{background:var(--gold);padding:0 16px}
.pillnav .book span{max-width:60px;margin-left:0}
.pillnav svg{width:19px;height:19px;flex:none}
.topnav{position:absolute;inset:16px 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-inline:max(18px,calc((100% - var(--max))/2 + 18px))}
.topnav img{height:34px;width:auto}
.topnav .links{display:flex;gap:2px;padding:5px;border-radius:99px;background:rgba(245,246,245,.92);backdrop-filter:blur(12px)}
.topnav .links a{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;text-decoration:none}
.topnav .links a.on{background:var(--mist2)}
.textnav{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(18px,calc((100% - var(--max))/2 + 18px));background:var(--paper)}
.textnav .links{display:flex;gap:18px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.textnav .links a{text-decoration:none}
.textnav img{height:32px;width:auto}
@media (max-width:720px){.topnav .links,.textnav .links{display:none}}

/* ---------- 02 hero ---------- */
.hero1{position:relative;min-height:min(86vh,760px);display:flex;align-items:flex-end;color:#fff;background:var(--night)}
.hero1::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,17,20,.86),rgba(12,17,20,.15) 55%,rgba(12,17,20,.25))}
.hero1 .in{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:end;padding-block:120px 44px}
.hero1 .hd{font-size:clamp(40px,7.4vw,96px);color:#fff} .hero1 .hd .dim{color:var(--mist)}
.hero1 p{color:#e3ecef;font-size:17px;margin:0 0 16px;max-width:36ch}
@media (max-width:820px){.hero1 .in{grid-template-columns:1fr}}
.maskwrap{position:relative;overflow:hidden;background:var(--deep)}
.maskwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.maskwrap .mtxt{position:relative;background:var(--deep);color:#fff;mix-blend-mode:multiply;font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;word-spacing:.12em;line-height:.88;text-align:center;margin:0;padding:.08em 0}
.maskwrap.light{background:var(--paper)} .maskwrap.light .mtxt{background:var(--paper);color:#000;mix-blend-mode:screen}
.hero2{background:var(--deep);color:#fff;text-align:center;padding-block:clamp(70px,10vw,120px) clamp(48px,7vw,80px)}
.hero2 .mtxt{font-size:clamp(54px,16.2vw,232px)}
.maskwrap .mtxt{white-space:nowrap}
.hero2 p{color:#c3d0d6;font-size:18px;max-width:44ch;margin:26px auto 22px}
.hero2 .row{justify-content:center}
.hero3{position:relative;text-align:center;padding-block:clamp(96px,14vw,190px);overflow:hidden}
.hero3 .hd{font-size:clamp(38px,6.4vw,84px);max-width:13ch;margin-inline:auto;position:relative;z-index:1}
.hero3 p{position:relative;z-index:1;margin:20px auto 22px;max-width:40ch;color:var(--mute);font-size:17px}
.hero3 .row{justify-content:center;position:relative;z-index:1}
.bub{position:absolute;border-radius:50%;overflow:hidden;box-shadow:0 20px 40px -20px rgba(26,35,39,.5);animation:floaty 9s ease-in-out infinite}
.bub img{width:100%;height:100%;object-fit:cover}
@keyframes floaty{50%{transform:translateY(-14px)}}
@media (max-width:760px){.bub{opacity:.9}.bub.hm{display:none}}

/* ---------- 03 thirty years ---------- */
.yrs1{background:var(--deep);padding-block:clamp(60px,9vw,120px);text-align:center}
.yrs1 .mtxt{font-size:clamp(44px,11.5vw,170px)}
.yrs1 .swap{display:block;height:.9em;overflow:hidden}
.yrs1 .swap span{display:block;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.yrs2 .big{font-family:var(--disp);font-weight:600;font-size:clamp(28px,4.6vw,58px);line-height:1.08;letter-spacing:-.03em;max-width:20ch;margin:0}
.yrs2 .big span{color:#c9d1d4;transition:color .25s}
.yrs2 .big span.on{color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.nums>div{padding:26px 18px 6px 0;border-right:1px solid var(--line);min-width:0}
.nums>div:last-child{border:0}
.nums b{display:block;font-family:var(--disp);font-weight:500;font-size:clamp(44px,7vw,96px);letter-spacing:-.05em;line-height:1}
.nums span{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
@media (max-width:760px){.nums{grid-template-columns:1fr 1fr}.nums>div:nth-child(2){border-right:0}}

/* ---------- 04 services ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px}
.tile{min-width:0;text-decoration:none}
.tile .ph{position:relative;aspect-ratio:1;overflow:hidden;border-radius:4px;background:var(--mist2)}
.tile .ph img{transition:transform .8s cubic-bezier(.16,1,.3,1)}
.tile:hover .ph img{transform:scale(1.05)}
.tile h3{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:-.01em;text-transform:uppercase;margin:12px 0 2px}
.tile p{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0;line-height:1.5}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:14px}
.scard{position:sticky;top:76px;display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#11181c;border:1px solid var(--lineD);padding:14px;min-height:420px}
.scard .tx{padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-width:0}
.scard h3{font-family:var(--disp);font-weight:700;font-size:clamp(24px,3vw,34px);text-transform:uppercase;letter-spacing:-.02em;line-height:1;margin:0 0 12px}
.scard p{color:#9eb0b8;font-size:14.5px;margin:0;max-width:34ch}
.scard ol{list-style:none;margin:0;padding:0;font-size:13.5px;color:#c3d0d6;display:grid;gap:6px}
.scard ol li::before{content:attr(data-n);font-family:var(--mono);font-size:11px;color:#6f838c;margin-right:12px}
.scard .ph{position:relative;min-height:260px;overflow:hidden}
@media (max-width:760px){.scard{grid-template-columns:1fr;position:relative;top:auto;min-height:0}.scard .ph{aspect-ratio:4/3;order:-1}}
.rows{border-top:1px solid var(--line)}
.rw{display:grid;grid-template-columns:54px 1.1fr 1.4fr 44px;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);position:relative}
.rw .n{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.rw h3{font-family:var(--disp);font-weight:500;font-size:clamp(20px,2.4vw,27px);letter-spacing:-.02em;margin:0}
.rw p{margin:0;font-size:14.5px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags i{font-style:normal;font-size:11.5px;background:var(--mist2);border-radius:99px;padding:3px 10px;color:var(--storm)}
.rw .go{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.rw .peek{position:absolute;right:70px;top:50%;width:200px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;transform:translateY(-50%) rotate(3deg) scale(.9);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s;box-shadow:0 20px 40px -18px rgba(0,0,0,.5);z-index:2}
@media (hover:hover){.rw:hover .peek{opacity:1;transform:translateY(-50%) rotate(-2deg) scale(1)}.rw:hover .go{background:var(--ink);color:#fff}}
@media (max-width:760px){.rw{grid-template-columns:34px 1fr;gap:6px 10px}.rw p{grid-column:2}.rw .go,.rw .peek{display:none}}

/* ---------- 05 smile designer ---------- */
.sd{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center}
.sd canvas{width:100%;aspect-ratio:16/10;display:block;border-radius:var(--r);touch-action:pan-y}
.sd .ctl{display:grid;gap:16px}
.sd label{display:grid;gap:6px;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.sd label span{display:flex;justify-content:space-between;opacity:.8}
.sd input[type=range]{width:100%;accent-color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid currentColor;background:transparent;border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;opacity:.75}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--onGold);border-color:var(--gold);opacity:1}
.fine{font-size:12.5px;color:var(--mute);margin:0}
.dark .fine,.deep .fine{color:#8fa2ab}
.cmp{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);touch-action:pan-y;cursor:ew-resize;user-select:none}
.cmp canvas{width:100%;aspect-ratio:16/9;display:block}
.cmp .hdl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.cmp .hdl::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:99px;padding:6px 10px;font-size:13px;white-space:nowrap}
.cmp .tagl,.cmp .tagr{position:absolute;top:12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--paper);border-radius:99px;padding:4px 10px}
.cmp .tagl{left:12px}.cmp .tagr{right:12px}
@media (max-width:860px){.sd{grid-template-columns:1fr}}

/* ---------- 06 process ---------- */
.luca{display:grid;gap:0}
.luca .st{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(18px,4vw,60px);align-items:center;padding-block:clamp(22px,3vw,40px);border-top:1px solid var(--line)}
.luca .st:nth-child(even) .ph{order:2}
.luca .ph{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r)}
.luca .k{font-family:var(--disp);font-weight:300;font-size:clamp(44px,7vw,92px);letter-spacing:-.05em;line-height:.9;color:var(--dim);text-transform:lowercase}
.luca h3{font-family:var(--disp);font-weight:600;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;margin:10px 0 8px}
.luca p{color:var(--mute);margin:0;max-width:42ch}
@media (max-width:760px){.luca .st{grid-template-columns:1fr}.luca .st:nth-child(even) .ph{order:0}}
.pstack{display:grid;gap:14px}
.pcard{position:sticky;top:76px;background:#dfe5e7;color:var(--ink);border-radius:22px;padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,5vw,70px);align-items:end;min-height:300px;box-shadow:0 -14px 30px -18px rgba(0,0,0,.5)}
.pcard:nth-child(2){background:#d3dcdf}.pcard:nth-child(3){background:#c8d4d8}.pcard:nth-child(4){background:var(--mist)}
.pcard .num{font-family:var(--disp);font-weight:600;font-size:clamp(84px,15vw,190px);letter-spacing:-.07em;line-height:.74}
.pcard .lab{display:flex;justify-content:space-between;border-bottom:1px solid rgba(26,35,39,.25);padding-bottom:8px;margin-bottom:auto}
.pcard .tx{display:grid;gap:8px;align-content:end;min-height:200px}
.pcard h3{font-family:var(--disp);font-weight:600;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.02em;margin:0}
.pcard p{margin:0;font-size:15px;max-width:44ch;color:#3a474c}
@media (max-width:640px){.pcard{grid-template-columns:1fr;position:relative;top:auto}}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative;padding-top:34px}
.tl::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}
.tl::after{content:"";position:absolute;left:0;top:9px;height:2px;width:var(--p,0%);background:var(--ink);transition:width .2s linear}
.tl .st{position:relative;min-width:0}
.tl .st::before{content:"";position:absolute;left:0;top:-32px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.tl .st.on::before{background:var(--gold);border-color:var(--goldD)}
.tl h3{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.02em;margin:6px 0 6px}
.tl p{margin:0;font-size:14.5px;color:var(--mute)}
@media (max-width:820px){.tl{grid-template-columns:1fr;padding:0 0 0 30px;gap:26px}.tl::before{left:7px;right:auto;top:0;bottom:0;width:2px;height:auto}.tl::after{display:none}.tl .st::before{left:-30px;top:4px}}

/* ---------- 07 results ---------- */
.helix{position:relative;height:clamp(420px,62vw,640px);perspective:1300px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.helix .rot{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.helix .cd{position:absolute;width:clamp(150px,22vw,240px);aspect-ratio:3/2;margin:calc(clamp(150px,22vw,240px)/-3) 0 0 calc(clamp(150px,22vw,240px)/-2);border-radius:12px;overflow:hidden;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);backface-visibility:hidden;background:#ccc}
.helix .cd img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.hint{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:center;margin:14px 0 0}
.dark .hint,.deep .hint{color:#8fa2ab}
.globe{position:relative;height:clamp(380px,60vw,620px);perspective:1100px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.globe .rot{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.globe .tl2{position:absolute;width:clamp(86px,13vw,150px);aspect-ratio:3/2;margin:calc(clamp(86px,13vw,150px)/-3) 0 0 calc(clamp(86px,13vw,150px)/-2);border-radius:8px;overflow:hidden;background:#ccc;backface-visibility:hidden}
.globe .tl2 img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.bacards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.bacards::-webkit-scrollbar{display:none}
.ba{flex:0 0 min(420px,82%);scroll-snap-align:center;display:grid;gap:10px}
.ba .ph{position:relative;aspect-ratio:3/2;border-radius:var(--r);overflow:hidden;background:#ccc}
.ba .ph img{transition:opacity .35s}
.ba .ph .bf{opacity:0}
.ba.show .ph .bf{opacity:1}
.ba .meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ba .meta b{font-family:var(--disp);font-weight:600;font-size:17px}
.ba button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.lb{position:fixed;inset:0;z-index:80;background:rgba(12,17,20,.86);display:grid;place-items:center;padding:20px}
.lb .box{background:var(--card);border-radius:18px;padding:14px;max-width:min(560px,100%);display:grid;gap:10px}
.lb .pair{display:grid;gap:8px}
.lb .pair div{position:relative;aspect-ratio:3/2;border-radius:10px;overflow:hidden}
.lb .pair span{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;text-transform:uppercase;background:var(--paper);border-radius:99px;padding:3px 9px;z-index:1}

/* ---------- 08 tech / 09 team (glass flip) ---------- */
.over{position:relative;padding:clamp(22px,4vw,56px);border-radius:26px;overflow:hidden;min-height:520px;display:grid;align-items:end;background:var(--night)}
.over>img{filter:brightness(.72) saturate(1.05)}
.flips{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.flip{perspective:1000px;aspect-ratio:3/4;cursor:pointer;border:0;background:transparent;padding:0;text-align:left;min-width:0}
.flip .inr{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.flip[aria-pressed="true"] .inr{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.flip .b{transform:rotateY(180deg)}
.flip .k{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.flip .k i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:12px}
.flip h3{font-family:var(--disp);font-weight:600;font-size:clamp(18px,2vw,24px);letter-spacing:-.02em;line-height:1.05;margin:0}
.flip p{margin:0;font-size:14px;line-height:1.45}
.flip .f>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
@media (max-width:900px){.flips{grid-template-columns:1fr 1fr}}
.bento{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}
.bento figure{position:relative;margin:0;border-radius:var(--r);overflow:hidden;min-height:250px;background:#11181c}
.bento figure.big{grid-row:span 2}
.bento figure.w2{grid-column:span 2}
.bento figcaption{position:absolute;inset:auto 0 0;padding:18px;background:linear-gradient(0deg,rgba(8,13,16,.9),transparent);color:#fff}
.bento figcaption b{font-family:var(--disp);font-size:19px;font-weight:600;display:block}
.bento figcaption span{font-size:13.5px;color:#c9d6dc}
@media (max-width:820px){.bento{grid-template-columns:1fr 1fr}.bento figure.big{grid-column:span 2;grid-row:auto;min-height:300px}}
@media (max-width:480px){.bento{grid-template-columns:1fr}.bento figure,.bento figure.big{grid-column:auto!important}}
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,5vw,70px);align-items:start}
.about .ph{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:4px}
.about .blk{padding-block:18px;border-top:1px solid var(--line)}
.about h3{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(22px,3vw,34px);letter-spacing:-.02em;margin:0 0 8px}
.about p{margin:0;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);line-height:1.6;max-width:52ch}
@media (max-width:760px){.about{grid-template-columns:1fr}.about .ph{aspect-ratio:4/3}}
.band{position:relative;height:clamp(240px,42vw,520px);border-radius:var(--r);overflow:hidden}
.names{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
.names div{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.names b{display:block;font-family:var(--disp);font-weight:600;font-size:15px;line-height:1.2}
.names span{font-size:12px;color:var(--mute)}
@media (max-width:820px){.names{grid-template-columns:1fr 1fr 1fr}} @media (max-width:480px){.names{grid-template-columns:1fr 1fr}}

/* ---------- 10 cost / 11 reviews / 12 visit / 13 faq / 14 form ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,4vw,56px)}
.two .c{border-top:2px solid var(--ink);padding-top:18px;min-width:0}
.two h3{font-family:var(--disp);font-weight:600;font-size:clamp(22px,2.8vw,34px);letter-spacing:-.025em;line-height:1.08;margin:8px 0 14px}
.two ul,.plain{margin:0;padding:0;list-style:none;display:grid;gap:9px;color:var(--mute);font-size:15px}

.ya-v,.yb-v{border-radius:24px;overflow:hidden;background:#111;aspect-ratio:16/9}
.ya-v video,.yb-v video,.yc video{width:100%;height:100%;object-fit:cover;display:block}
.yb{display:grid;grid-template-columns:1fr 1.3fr;gap:48px;align-items:center}
.yb-n{display:block;font-family:var(--disp);font-weight:800;font-size:clamp(120px,16vw,220px);line-height:.8;letter-spacing:-.07em;color:var(--gold)}
.yb-t .hd{margin-top:14px}.yb-t p{color:var(--mute);font-size:17px}
.yb-t ul{list-style:none;padding:0;margin:22px 0 0;display:flex;gap:28px}.yb-t li{font-size:14px;color:var(--mute)}.yb-t li b{display:block;font-size:24px;color:var(--ink);font-family:var(--disp)}
.yc{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:#111}
.yc video{position:absolute;inset:0}
.yc-f{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,14,17,.85),rgba(10,14,17,.2) 55%,rgba(10,14,17,0))}
.yc-t{position:absolute;left:0;right:0;bottom:8vh;color:#fff}.yc-t .eb{color:rgba(255,255,255,.7)}.yc-t .hd{color:#fff}.yc-t .hd em{color:var(--gold)}.yc-t p:not(.eb){color:rgba(255,255,255,.85);max-width:520px;font-size:17px}
@media (max-width:767px){.ya-v,.yb-v{aspect-ratio:4/5}.yb{grid-template-columns:1fr;gap:26px}}
/* closing form on computers: offer panel on the left, form on the right */
@media (min-width:900px){.fbox{width:min(1080px,100%);display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:1fr auto}.fbox>.ptop{grid-row:1/3;display:flex;flex-direction:column;justify-content:center;padding:52px 48px}.fbox>.ptop h3{font-size:clamp(34px,3.4vw,46px)}.fbox>.form{padding:40px 44px 8px}.fbox>.fcall{padding:4px 44px 36px}}

/* call button under the closing form */
.fcall{display:grid;gap:10px;justify-items:center;text-align:center}
.fcb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;border-radius:99px;border:2px solid var(--ink);color:var(--ink);font-weight:700;font-size:17px;text-decoration:none;transition:background .2s,color .2s}
.fcb:hover{background:var(--ink);color:#fff}
/* offer bar on computers: sits on the bottom edge of the hero, no separate dark band */
@media (min-width:641px){.ostrip{background:transparent;position:relative;z-index:3;margin-top:-46px;padding-block:0 8px}.obar{background:rgba(20,28,33,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(255,255,255,.18);box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}}
/* footer and legal pop-ups */
.lf{background:var(--deep,#111a1f);color:rgba(255,255,255,.62);font-size:13px;padding:22px 0 calc(22px + env(safe-area-inset-bottom))}
.lf .in{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center}
.lfl{display:flex;gap:20px}.lf a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.lgl{position:fixed;inset:0;z-index:120;background:rgba(12,17,20,.55);display:grid;place-items:center;padding:20px}
.lgl .lgb{background:#fff;border-radius:22px;width:min(860px,100%);height:min(86vh,900px);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.lgl .lgh{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 22px;border-bottom:1px solid var(--line)}
.lgl .lgh b{flex:1;font-family:var(--disp);font-size:20px}.lgl .lgh a{font-size:13px;color:var(--mute)}
.lgl .lgh button{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:20px;cursor:pointer}
.lgl iframe{width:100%;height:100%;border:0}
@media (max-width:640px){.lgl{padding:0;place-items:end stretch}.lgl .lgb{border-radius:22px 22px 0 0;height:92vh}}
/* 30-years video: no dark shade, text sits on a small solid white card */
.yc-f{display:none}
.yc-t{left:max(18px,calc((100% - var(--max))/2 + 18px));right:auto;bottom:6vh;width:min(520px,calc(100% - 36px));background:#fff;color:var(--ink);border-radius:22px;padding:26px 28px;box-shadow:0 24px 50px -26px rgba(0,0,0,.45)}
.yc-t .eb{color:var(--mute)}.yc-t .hd{color:var(--ink);font-size:clamp(28px,3.4vw,44px)}.yc-t .hd em{color:var(--goldD)}.yc-t p:not(.eb){color:var(--mute);font-size:16px}
@media (max-width:640px){.yc-t{bottom:16px;padding:20px 20px 18px}}
/* visit cards: no width change on hover (text no longer re-wraps); gentle lift instead */
@media (hover:hover) and (min-width:761px){.acc3:hover .pn{flex:1}.acc3 .pn:hover{flex:1.8}
  .acc3 .cap{white-space:nowrap;min-width:0;max-width:100%}.acc3 .cap b{font-size:min(22px,1.7vw)}
  .acc3 .cap span:last-child{font-size:13px;overflow:hidden;text-overflow:ellipsis}}
/* 30-years video: back to no background behind the text */
.yc-t{background:none;box-shadow:none;color:#fff;left:0;right:0;width:auto;margin-inline:auto;width:min(var(--max),100%);padding:0 18px}
.yc-t .eb{color:rgba(255,255,255,.8)}.yc-t .hd{color:#fff;font-size:clamp(32px,4.6vw,60px)}.yc-t .hd em{color:var(--gold)}.yc-t p:not(.eb){color:#fff;max-width:520px}
.yc-t>*{text-shadow:0 2px 18px rgba(0,0,0,.45)}

/* offer bar on computers: dark blue ribbon pinned to the bottom of the first screen */
@media (min-width:641px){.hero1{min-height:calc(100vh - 72px);min-height:calc(100svh - 72px)}
  .ostrip{margin-top:0;background:var(--night);padding:0;position:relative;z-index:3}
  .obar{height:72px;box-sizing:border-box;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;box-shadow:none;border-radius:0;color:#fff;padding:0}
  .obar:hover{background:none}.obar b{color:var(--gold);font-weight:700}.osep{background:rgba(255,255,255,.25)}.ogo{background:var(--gold);color:var(--ink)}}

@media (min-width:768px){.yc{height:auto;min-height:0;aspect-ratio:16/9;max-height:none}}
/* one gold button per screen: menu and offer-ribbon buttons go quiet, the hero "Book a consult" stays gold */
@media (min-width:641px){body.final .topnav .btn.b-gold{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  body.final .topnav .btn.b-gold:hover{background:#fff;color:var(--ink)}
  .ogo{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}.obar:hover .ogo{background:#fff;color:var(--ink)}}
/* technology cards: plain soft background instead of the hallway photo */
.tover.tplain{background:linear-gradient(160deg,#e7eef2,#d6e2e9)}

.lgl .lgt{overflow:auto;padding:22px 26px 40px;font-size:15px;line-height:1.6;color:var(--ink)}
.lgl .lgt h1,.lgl .lgt h2{font-family:var(--disp);font-size:24px;margin:18px 0 8px}.lgl .lgt h3,.lgl .lgt h4{font-size:17px;margin:16px 0 6px}
.lgl .lgt p,.lgl .lgt li{color:#3c4a52}.lgl .lgt a{color:var(--ink)}

.lgl{position:fixed!important;inset:0!important;display:grid!important;place-items:center!important}.lgl .lgb{position:relative;grid-template-rows:auto minmax(0,1fr)!important;max-width:860px;margin:auto}.lgl .lgh{position:static}

.pmini{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,2.4vw,32px);position:relative}
.pmini:before{content:"";position:absolute;left:12%;right:12%;top:38px;border-top:1px dashed var(--line)}
.pmini li{position:relative;text-align:center}
.pmini .pi{position:relative;width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:var(--bg,#fff);border:1px solid var(--line);display:grid;place-items:center}
.pmini svg{width:34px;height:34px;fill:none;stroke:var(--night);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pmini .pi span{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--night);font:600 12px/24px var(--disp)}

@media(max-width:760px){.pmini{grid-template-columns:1fr 1fr;row-gap:28px}.pmini:before{display:none}}

/* round 6: dot-drawn process (dots.js) */

.dq1{grid-template-columns:repeat(4,1fr)}
.dq1 li{text-align:center}
.dq1 canvas{display:block;width:100%;aspect-ratio:1;max-width:220px;margin:0 auto 10px;touch-action:pan-y}
.dq1 .k,.dq2 .k,.dq3 .k,.dq4 .k,.dq5 .k{display:block;font:500 12px/1.2 var(--mono,monospace);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.dq1 h3,.dq3 h3,.dq4 h3{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0 0 6px}
.dq1 p,.dq3 p,.dq4 p{margin:0 auto;color:var(--mute);font-size:14.5px;max-width:32ch}
@media(max-width:760px){.dq1{grid-template-columns:1fr 1fr;row-gap:30px}.dq1 canvas{max-width:170px}}
.dq2w{height:400vh;position:relative}
.dq2{position:sticky;top:0;height:100vh;display:flex;align-items:center;background:var(--bg,#fff)}

.dq2s{position:relative;min-height:190px;margin-top:22px}

.dq2s .it.on{opacity:1;transform:none}
.dq2s h3{font-family:var(--disp);font-weight:600;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.015em;margin:0 0 8px}
.dq2s p{margin:0;color:var(--mute);max-width:40ch}
.dq2p{display:flex;gap:8px;margin-top:8px}.dq2p i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s}.dq2p i.on{background:var(--gold)}
@media(max-width:760px){.dq2g{grid-template-columns:1fr;gap:6px}.dq2 canvas{order:-1;max-height:40vh;width:auto;margin:0 auto}.dq2s{min-height:200px;margin-top:6px}.dq2 .eyb,.dq2 h2{font-size:28px}}
.dq3{position:relative}
.dq3 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.dq3 ol{list-style:none;margin:0;padding:clamp(170px,22vw,230px) 0 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,2.4vw,32px);position:relative;pointer-events:none}
.dq3 li{text-align:center;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}.dq3 li.on{opacity:1;transform:none}
@media(max-width:700px){.dq3{min-height:1150px}.dq3 ol{display:block;padding:0}.dq3 li{position:absolute;left:0;right:0;top:var(--y);background:color-mix(in srgb,var(--bg,#fff) 82%,transparent);padding:6px 0}}
.dq4{grid-template-columns:1fr 1fr}
.dq4 li{display:grid;grid-template-columns:clamp(110px,14vw,170px) 1fr;gap:18px;align-items:center}
.dq4 canvas{width:100%;aspect-ratio:1;display:block;touch-action:pan-y}
.dq4 p{margin:0}
@media(max-width:760px){.dq4{grid-template-columns:1fr;gap:22px}.dq4 li{grid-template-columns:110px 1fr}}
.dq5w{height:420vh;position:relative;background:#1f2b31}
.dq5{position:sticky;top:0;height:100vh;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 70% 50%,#2B3A42,#1a2429)}
.dq5 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.dq5 .in{position:relative;height:100%;display:flex;align-items:center;pointer-events:none}
.dq5t{position:relative;width:min(44%,460px);min-height:240px}
.dq5 .ey{display:block;font:500 12px var(--mono,monospace);letter-spacing:.14em;text-transform:uppercase;color:#8AA2AE;margin-bottom:18px}
.dq5 .it{position:absolute;left:0;right:0;top:36px;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.dq5 .it.on{opacity:1;transform:none}
.dq5 h3{font-family:var(--disp);font-weight:600;font-size:clamp(26px,3vw,40px);letter-spacing:-.02em;margin:0 0 10px;color:#fff}
.dq5 p{margin:0;color:#BDD4DE;max-width:40ch}
@media(max-width:760px){.dq5 .in{align-items:flex-end;padding-bottom:9vh}.dq5t{width:100%;min-height:210px}}

/* v46: video hero, why, cta bands */
.hv{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:#111;color:#fff}
.hv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* FAQ on desktop: questions left, answer right, simple fade */
@media (min-width:900px){
  .fflip{perspective:none;height:auto!important;min-height:0!important}.ffi{height:auto!important;min-height:0!important}
  .ffi,.fflip.on .ffi{transform:none;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:start}
  .ffa,.ffb{position:static;transform:none;backface-visibility:visible;-webkit-backface-visibility:visible}
  .ffa .chips{display:grid;gap:8px}
  .ffa .chips button{width:100%;text-align:left;transition:background .25s,color .25s,border-color .25s}
  .ffa .chips button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
  .ffb{cursor:default;min-height:240px;padding:32px}

@keyframes faqIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.wy h3{margin-top:14px}

/* FAQ looks (temporary picker) */
.faqsw{background:var(--paper);padding:14px 0;border-top:1px solid var(--line)}
.faqsw .in{display:flex;align-items:center;gap:8px;font:500 13px var(--body);color:var(--mute)}
.faqsw button{border-radius:99px;border:1px solid var(--line);background:var(--card);font:600 13.5px var(--body);color:var(--ink);padding:9px 15px;cursor:pointer}
.faqsw button[aria-pressed="true"]{background:var(--night);color:#fff;border-color:var(--night)}
.fqacc details{border-top:1px solid var(--line)}.fqacc details:last-child{border-bottom:1px solid var(--line)}
.fqacc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 0;font-family:var(--disp);font-weight:600;font-size:clamp(18px,1.7vw,22px);letter-spacing:-.015em}
.fqacc summary::-webkit-details-marker{display:none}
.fqacc summary i{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid var(--line);position:relative;transition:transform .3s,background .3s}
.fqacc summary i:before,.fqacc summary i:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;background:currentColor;transform:translate(-50%,-50%)}

/* Process section, round 6: the four veneer steps drawn in fine dots (Luca's dot language), built step by step,
   dots scatter away from the mouse or a finger and drift back. Five directions, added as process options 5-9.
   Without canvas, or with reduced motion, the dots settle instantly and the text reads on its own. */
const DOT = { ink: '#2B3A42', gold: '#D4A333', mist: '#8AA2AE', paper: '#fff' };
const DRM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOOTH = new Path2D('M12 3c-3 0-5 1.6-5 4.5 0 2 .6 3.5 1 6 .4 2.6.8 6.5 2.2 6.5 1.3 0 1.2-4 1.8-4s.5 4 1.8 4c1.4 0 1.8-3.9 2.2-6.5.4-2.5 1-4 1-6C17 4.6 15 3 12 3z');
const STEP_T = ['Scan and digital design', 'Gentle preparation', 'Try your temporaries', 'Bond and reveal'];

/* each scene draws into a 100x100 box; gold strokes become gold dots */
function sceneDraw(o, i, ink, gold) {
  o.lineCap = 'round'; o.lineJoin = 'round';

  if (i === 0) { // scanner screen with a smile arc
    o.strokeStyle = ink; o.lineWidth = 3.4; o.beginPath(); o.roundRect(14, 18, 72, 50, 6); o.stroke();
    o.beginPath(); o.moveTo(40, 82); o.lineTo(60, 82); o.moveTo(50, 68); o.lineTo(50, 82); o.stroke();
    o.strokeStyle = gold; o.lineWidth = 3.2; o.beginPath(); o.moveTo(28, 38); o.quadraticCurveTo(50, 60, 72, 38); o.stroke();
    o.lineWidth = 2; for (let k = 0; k < 6; k++) { const x = 33 + k * 7; o.beginPath(); o.moveTo(x, 40 + Math.sin((k + .5) / 6 * Math.PI) * 6); o.lineTo(x, 46 + Math.sin((k + .5) / 6 * Math.PI) * 6); o.stroke(); }
  } else if (i === 1) { // tooth with a thin veneer shell in gold
    tooth(14, 8, 3.1, ink, 3.4);
    o.strokeStyle = gold; o.lineWidth = 3; o.beginPath(); o.moveTo(31, 22); o.quadraticCurveTo(50, 10, 69, 22); o.stroke();
    o.setLineDash([1, 5]); o.lineWidth = 2; o.beginPath(); o.moveTo(26, 30); o.quadraticCurveTo(50, 16, 74, 30); o.stroke(); o.setLineDash([]);
  } else if (i === 2) { // hand mirror with a smile
    o.strokeStyle = ink; o.lineWidth = 3.4; o.beginPath(); o.ellipse(46, 38, 25, 27, -.15, 0, 7); o.stroke();
    o.beginPath(); o.moveTo(58, 62); o.lineTo(74, 88); o.stroke();
    o.strokeStyle = gold; o.lineWidth = 3; o.beginPath(); o.moveTo(34, 40); o.quadraticCurveTo(46, 52, 58, 38); o.stroke();
  } else { // finished tooth with sparkles
    tooth(18, 10, 2.8, ink, 3.4);
    star(78, 22, 8); star(88, 42, 4.5); star(22, 70, 5);
  }
}
function numeralDraw(o, i, ink) { o.fillStyle = ink; o.font = '300 72px Urbanist, Inter Tight, Arial'; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillText('0' + (i + 1), 50, 54); }

/* sample a 100x100 drawing into dot targets inside a w x h rect at (ox, oy) */
function sampleScene(draw, ox, oy, size, gap) {
  const S = Math.max(40, Math.round(size)), c = document.createElement('canvas'); c.width = c.height = S;

}

/* the engine: one canvas, a pool of dots with springs, a pointer that pushes them away */
function DotStage(cv, opt = {}) {

  S.set = (T, from = 'scatter', spread = 900, order = 'x') => {
    const now = performance.now();

    P.forEach((p, i) => {
      const t = T[i];
      if (t) {
        if (from === 'scatter' && p.a === 0) { p.x = rnd(-W * .1, W * 1.1); p.y = rnd(-H * .2, H * 1.2); }
        if (from === 'left' && p.a === 0) { p.x = -rnd(10, W * .5); p.y = t.y + rnd(-H * .15, H * .15); }
        p.tx = t.x; p.ty = t.y; p.tc = t.c; p.ta = 1;
        p.t0 = now + ((order === 'x' ? t.x : t.y) / mxo) * spread + rnd(0, spread * .35);
      } else { p.ta = 0; p.t0 = now + rnd(0, 300); p.tx = from === 'left' ? W + rnd(20, 200) : p.x + rnd(-80, 80); p.ty = p.y + rnd(-60, 60); }
    });
    if (DRM) P.forEach(p => { p.x = p.tx; p.y = p.ty; p.a = p.ta; p.c = p.tc || p.c; });
    kick();
  };

  const step = (now) => {
    raf = 0; if (!alive) return;
    if (!document.body.contains(cv)) { alive = false; return; }

      if (p.a < .02) continue;

}

/* visible-once helper: calls fn(el) the first time el is 25% in view */
