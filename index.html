<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Parmer Smile Consult</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a landing page shown section by section. Every section has a slim picker bar (1/2/3 + Pick) and a full-width stage.
   One character for all options: off-white paper, Night Sky ink, tight grotesk headlines in two tones, tiny mono labels in brackets,
   gold only on the main action. Single committed look (the real page will not follow the viewer's theme). */
:root{
  color-scheme:light;
  --paper:#f5f6f5; --card:#ffffff; --ink:#1a2327; --night:#2B3A42; --deep:#0c1114; --storm:#3F5765;
  --mist:#BDD4DE; --mist2:#e4edf0; --dim:#98a4a9; --mute:#5d6b71; --line:#dde3e5; --lineD:#263238;
  --gold:#EBB63D; --goldD:#D4A333; --onGold:#191919;
  --disp:"Inter Tight",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --script:"Caveat",cursive;
  --r:14px; --max:1200px;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
.in{max-width:var(--max);margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- picker chrome ---------- */
.top{padding-block:26px 8px}
.top h1{font-family:var(--disp);font-size:clamp(26px,4vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.top p{color:var(--mute);max-width:68ch;margin:0}
.lab{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.status{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:13px;color:var(--mute)}
.meter{flex:1;min-width:140px;max-width:320px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--night);transition:width .3s}
.tog{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--night);color:#fff;border-color:var(--night)}
.pk{border-top:1px solid var(--line);margin-top:34px}
.pk-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
.pk-bar .in{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:9px}
.pk-bar b{font-family:var(--disp);font-size:16px;font-weight:600}
.pk-bar .ref{font-size:12px;color:var(--mute);flex:1;min-width:120px}
.seg{display:flex;gap:4px;background:var(--mist2);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;min-width:38px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button.picked::after{content:" ✓";color:#1a8f55}
.pickb{border:1px solid var(--night);background:transparent;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.pickb[aria-pressed="true"]{background:var(--night);color:#fff}
.pk-foot .in{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding-block:10px 0}
.pk-foot .vn{font-size:13.5px;font-weight:600;flex:0 1 auto}
.pk-foot .vd{font-size:13px;color:var(--mute);flex:1 1 260px}
.pk-foot input{flex:1 1 240px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--goldD);outline-offset:2px}
.stage{position:relative;background:var(--paper);overflow:clip}
body.preview .pk{border:0;margin:0} body.preview .pk-bar,body.preview .pk-foot,body.preview .top .hidep{display:none}

/* ---------- shared page pieces ---------- */
.sec{padding-block:clamp(54px,8vw,104px)}
.dark{background:var(--night);color:#eef3f5} .deep{background:var(--deep);color:#eef3f5}
.eb{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
.dark .eb,.deep .eb{color:var(--mist)}
.hd{font-family:var(--disp);font-size:clamp(32px,5.2vw,62px);line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
.hd .dim{color:var(--dim)} .dark .hd .dim,.deep .hd .dim{color:#7f9099}
.hd em{font-style:normal}
.lede{font-size:17px;color:var(--mute);max-width:54ch;margin:16px 0 0}
.dark .lede,.deep .lede{color:#b9c8ce}
.head{margin-bottom:clamp(28px,4vw,48px)}
/* tone A: light uppercase, centred (IGOR) */
.tone-a .hd{font-weight:400;text-transform:uppercase;letter-spacing:-.02em}
.tone-a .head{text-align:center} .tone-a .head .lede{margin-inline:auto}
/* tone B: bold two-tone uppercase (OperatorX) */
.tone-b .hd{font-weight:700;text-transform:uppercase;letter-spacing:-.025em}
/* tone C: tight sentence case with one hand-written word (Monoform) */
.tone-c .hd{font-weight:500;letter-spacing:-.04em}
.tone-c .hd em{font-family:var(--script);font-weight:600;color:var(--dim);letter-spacing:0;font-size:1.12em;padding-inline:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;padding:14px 22px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.b-gold{background:var(--gold);color:var(--onGold)} .b-gold:hover{background:var(--goldD)}
.b-line{border-color:currentColor;background:transparent}
.b-ink{background:var(--ink);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,255,255,.12));backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 18px 40px -18px rgba(8,16,20,.55);border-radius:22px;color:#fff}
@media (max-width:640px){.row .btn{flex:1 1 100%}}

/* ---------- 01 nav ---------- */
.navdemo{position:relative;height:300px;overflow:hidden;background:var(--night)}
.navdemo>img{filter:brightness(.8)}
.pillnav{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px;background:rgba(245,246,245,.92);backdrop-filter:blur(14px);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);max-width:calc(100% - 24px)}
.pillnav button{border:0;background:transparent;border-radius:99px;height:42px;padding:0 12px;display:flex;align-items:center;gap:0;cursor:pointer;font-weight:600;font-size:14px;transition:background .3s,padding .3s}
.pillnav button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .4s cubic-bezier(.2,.9,.2,1),margin .3s}
.pillnav button[aria-current="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14);padding:0 16px}
.pillnav button[aria-current="true"] span{max-width:110px;margin-left:8px}
.pillnav .book{background:var(--gold);padding:0 16px}
.pillnav .book span{max-width:60px;margin-left:0}
.pillnav svg{width:19px;height:19px;flex:none}
.topnav{position:absolute;inset:16px 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-inline:max(18px,calc((100% - var(--max))/2 + 18px))}
.topnav img{height:34px;width:auto}
.topnav .links{display:flex;gap:2px;padding:5px;border-radius:99px;background:rgba(245,246,245,.92);backdrop-filter:blur(12px)}
.topnav .links a{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;text-decoration:none}
.topnav .links a.on{background:var(--mist2)}
.textnav{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(18px,calc((100% - var(--max))/2 + 18px));background:var(--paper)}
.textnav .links{display:flex;gap:18px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.textnav .links a{text-decoration:none}
.textnav img{height:32px;width:auto}
@media (max-width:720px){.topnav .links,.textnav .links{display:none}}

/* ---------- 02 hero ---------- */
.hero1{position:relative;min-height:min(86vh,760px);display:flex;align-items:flex-end;color:#fff;background:var(--night)}
.hero1::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,17,20,.86),rgba(12,17,20,.15) 55%,rgba(12,17,20,.25))}
.hero1 .in{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:end;padding-block:120px 44px}
.hero1 .hd{font-size:clamp(40px,7.4vw,96px);color:#fff} .hero1 .hd .dim{color:var(--mist)}
.hero1 p{color:#e3ecef;font-size:17px;margin:0 0 16px;max-width:36ch}
@media (max-width:820px){.hero1 .in{grid-template-columns:1fr}}
.maskwrap{position:relative;overflow:hidden;background:var(--deep)}
.maskwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.maskwrap .mtxt{position:relative;background:var(--deep);color:#fff;mix-blend-mode:multiply;font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;word-spacing:.12em;line-height:.88;text-align:center;margin:0;padding:.08em 0}
.maskwrap.light{background:var(--paper)} .maskwrap.light .mtxt{background:var(--paper);color:#000;mix-blend-mode:screen}
.hero2{background:var(--deep);color:#fff;text-align:center;padding-block:clamp(70px,10vw,120px) clamp(48px,7vw,80px)}
.hero2 .mtxt{font-size:clamp(54px,16.2vw,232px)}
.maskwrap .mtxt{white-space:nowrap}
.hero2 p{color:#c3d0d6;font-size:18px;max-width:44ch;margin:26px auto 22px}
.hero2 .row{justify-content:center}
.hero3{position:relative;text-align:center;padding-block:clamp(96px,14vw,190px);overflow:hidden}
.hero3 .hd{font-size:clamp(38px,6.4vw,84px);max-width:13ch;margin-inline:auto;position:relative;z-index:1}
.hero3 p{position:relative;z-index:1;margin:20px auto 22px;max-width:40ch;color:var(--mute);font-size:17px}
.hero3 .row{justify-content:center;position:relative;z-index:1}
.bub{position:absolute;border-radius:50%;overflow:hidden;box-shadow:0 20px 40px -20px rgba(26,35,39,.5);animation:floaty 9s ease-in-out infinite}
.bub img{width:100%;height:100%;object-fit:cover}
@keyframes floaty{50%{transform:translateY(-14px)}}
@media (max-width:760px){.bub{opacity:.9}.bub.hm{display:none}}

/* ---------- 03 thirty years ---------- */
.yrs1{background:var(--deep);padding-block:clamp(60px,9vw,120px);text-align:center}
.yrs1 .mtxt{font-size:clamp(44px,11.5vw,170px)}
.yrs1 .swap{display:block;height:.9em;overflow:hidden}
.yrs1 .swap span{display:block;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.yrs2 .big{font-family:var(--disp);font-weight:600;font-size:clamp(28px,4.6vw,58px);line-height:1.08;letter-spacing:-.03em;max-width:20ch;margin:0}
.yrs2 .big span{color:#c9d1d4;transition:color .25s}
.yrs2 .big span.on{color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.nums>div{padding:26px 18px 6px 0;border-right:1px solid var(--line);min-width:0}
.nums>div:last-child{border:0}
.nums b{display:block;font-family:var(--disp);font-weight:500;font-size:clamp(44px,7vw,96px);letter-spacing:-.05em;line-height:1}
.nums span{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
@media (max-width:760px){.nums{grid-template-columns:1fr 1fr}.nums>div:nth-child(2){border-right:0}}

/* ---------- 04 services ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px}
.tile{min-width:0;text-decoration:none}
.tile .ph{position:relative;aspect-ratio:1;overflow:hidden;border-radius:4px;background:var(--mist2)}
.tile .ph img{transition:transform .8s cubic-bezier(.16,1,.3,1)}
.tile:hover .ph img{transform:scale(1.05)}
.tile h3{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:-.01em;text-transform:uppercase;margin:12px 0 2px}
.tile p{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0;line-height:1.5}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:14px}
.scard{position:sticky;top:76px;display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#11181c;border:1px solid var(--lineD);padding:14px;min-height:420px}
.scard .tx{padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-width:0}
.scard h3{font-family:var(--disp);font-weight:700;font-size:clamp(24px,3vw,34px);text-transform:uppercase;letter-spacing:-.02em;line-height:1;margin:0 0 12px}
.scard p{color:#9eb0b8;font-size:14.5px;margin:0;max-width:34ch}
.scard ol{list-style:none;margin:0;padding:0;font-size:13.5px;color:#c3d0d6;display:grid;gap:6px}
.scard ol li::before{content:attr(data-n);font-family:var(--mono);font-size:11px;color:#6f838c;margin-right:12px}
.scard .ph{position:relative;min-height:260px;overflow:hidden}
@media (max-width:760px){.scard{grid-template-columns:1fr;position:relative;top:auto;min-height:0}.scard .ph{aspect-ratio:4/3;order:-1}}
.rows{border-top:1px solid var(--line)}
.rw{display:grid;grid-template-columns:54px 1.1fr 1.4fr 44px;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);position:relative}
.rw .n{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.rw h3{font-family:var(--disp);font-weight:500;font-size:clamp(20px,2.4vw,27px);letter-spacing:-.02em;margin:0}
.rw p{margin:0;font-size:14.5px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags i{font-style:normal;font-size:11.5px;background:var(--mist2);border-radius:99px;padding:3px 10px;color:var(--storm)}
.rw .go{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.rw .peek{position:absolute;right:70px;top:50%;width:200px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;transform:translateY(-50%) rotate(3deg) scale(.9);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s;box-shadow:0 20px 40px -18px rgba(0,0,0,.5);z-index:2}
@media (hover:hover){.rw:hover .peek{opacity:1;transform:translateY(-50%) rotate(-2deg) scale(1)}.rw:hover .go{background:var(--ink);color:#fff}}
@media (max-width:760px){.rw{grid-template-columns:34px 1fr;gap:6px 10px}.rw p{grid-column:2}.rw .go,.rw .peek{display:none}}

/* ---------- 05 smile designer ---------- */
.sd{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center}
.sd canvas{width:100%;aspect-ratio:16/10;display:block;border-radius:var(--r);touch-action:pan-y}
.sd .ctl{display:grid;gap:16px}
.sd label{display:grid;gap:6px;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.sd label span{display:flex;justify-content:space-between;opacity:.8}
.sd input[type=range]{width:100%;accent-color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid currentColor;background:transparent;border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;opacity:.75}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--onGold);border-color:var(--gold);opacity:1}
.fine{font-size:12.5px;color:var(--mute);margin:0}
.dark .fine,.deep .fine{color:#8fa2ab}
.cmp{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);touch-action:pan-y;cursor:ew-resize;user-select:none}
.cmp canvas{width:100%;aspect-ratio:16/9;display:block}
.cmp .hdl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.cmp .hdl::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:99px;padding:6px 10px;font-size:13px;white-space:nowrap}
.cmp .tagl,.cmp .tagr{position:absolute;top:12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--paper);border-radius:99px;padding:4px 10px}
.cmp .tagl{left:12px}.cmp .tagr{right:12px}
@media (max-width:860px){.sd{grid-template-columns:1fr}}

/* ---------- 06 process ---------- */
.luca{display:grid;gap:0}
.luca .st{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(18px,4vw,60px);align-items:center;padding-block:clamp(22px,3vw,40px);border-top:1px solid var(--line)}
.luca .st:nth-child(even) .ph{order:2}
.luca .ph{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r)}
.luca .k{font-family:var(--disp);font-weight:300;font-size:clamp(44px,7vw,92px);letter-spacing:-.05em;line-height:.9;color:var(--dim);text-transform:lowercase}
.luca h3{font-family:var(--disp);font-weight:600;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;margin:10px 0 8px}
.luca p{color:var(--mute);margin:0;max-width:42ch}
@media (max-width:760px){.luca .st{grid-template-columns:1fr}.luca .st:nth-child(even) .ph{order:0}}
.pstack{display:grid;gap:14px}
.pcard{position:sticky;top:76px;background:#dfe5e7;color:var(--ink);border-radius:22px;padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,5vw,70px);align-items:end;min-height:300px;box-shadow:0 -14px 30px -18px rgba(0,0,0,.5)}
.pcard:nth-child(2){background:#d3dcdf}.pcard:nth-child(3){background:#c8d4d8}.pcard:nth-child(4){background:var(--mist)}
.pcard .num{font-family:var(--disp);font-weight:600;font-size:clamp(84px,15vw,190px);letter-spacing:-.07em;line-height:.74}
.pcard .lab{display:flex;justify-content:space-between;border-bottom:1px solid rgba(26,35,39,.25);padding-bottom:8px;margin-bottom:auto}
.pcard .tx{display:grid;gap:8px;align-content:end;min-height:200px}
.pcard h3{font-family:var(--disp);font-weight:600;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.02em;margin:0}
.pcard p{margin:0;font-size:15px;max-width:44ch;color:#3a474c}
@media (max-width:640px){.pcard{grid-template-columns:1fr;position:relative;top:auto}}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative;padding-top:34px}
.tl::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}
.tl::after{content:"";position:absolute;left:0;top:9px;height:2px;width:var(--p,0%);background:var(--ink);transition:width .2s linear}
.tl .st{position:relative;min-width:0}
.tl .st::before{content:"";position:absolute;left:0;top:-32px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.tl .st.on::before{background:var(--gold);border-color:var(--goldD)}
.tl h3{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.02em;margin:6px 0 6px}
.tl p{margin:0;font-size:14.5px;color:var(--mute)}
@media (max-width:820px){.tl{grid-template-columns:1fr;padding:0 0 0 30px;gap:26px}.tl::before{left:7px;right:auto;top:0;bottom:0;width:2px;height:auto}.tl::after{display:none}.tl .st::before{left:-30px;top:4px}}

/* ---------- 07 results ---------- */
.helix{position:relative;height:clamp(420px,62vw,640px);perspective:1300px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.helix .rot{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}

/* Page motion for the final page: scroll reveals, stacking cards, the "30" scroll film, the offer pop-up.
   Everything degrades to a static, fully visible page if JS or IntersectionObserver is missing. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* 1. reveal on scroll: section heads, cards, rows fade up with a small stagger */
function revealInit(root = document) {
  if (RM || !('IntersectionObserver' in window)) return;
  const sel = '.head,.luca .st,.bacards,.tgrid,.dgrid,.rrail,.acc3 .pn,.faq1 details,.gcards .glass,.form,.offer-in,.qz,.ostrip .ot,.y30after';
  const els = [...root.querySelectorAll(sel)].filter(e => !e.closest('.pcard') && !e.classList.contains('rv'));
  els.forEach(e => { e.classList.add('rv'); const sib = [...e.parentElement.children].filter(x => x.matches(sel)); e.style.setProperty('--d', Math.min(5, sib.indexOf(e)) * 90 + 'ms'); });
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('on'); io.unobserve(x.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: .08 });
  els.forEach(e => io.observe(e));
  setTimeout(() => els.forEach(e => { if (e.getBoundingClientRect().bottom < 0) e.classList.add('on'); }), 1500);
}

/* 2. stacking cards: each card shrinks and dims a little as the next one slides over it */
function stackInit(el) {
  const cards = [...el.querySelectorAll('.pstack > .pcard')]; if (cards.length < 2 || RM) return;
  let raf = 0;
  const tick = () => { raf = 0; if (!document.body.contains(el)) { removeEventListener('scroll', on); removeEventListener('resize', on); return; }
    cards.forEach((c, i) => { const n = cards[i + 1]; if (!n) return; const top = parseFloat(getComputedStyle(n).top) || 0;
      const h = c.offsetHeight, nt = n.getBoundingClientRect().top; const p = clamp01(1 - (nt - top) / h);
      c.style.setProperty('--sc', (1 - .05 * p * (cards.length - i - 1) / (cards.length - 1) - .02 * p).toFixed(4)); c.style.setProperty('--pdim', (p * .22).toFixed(3)); }); };
  const on = () => { if (!raf) raf = requestAnimationFrame(tick); };
  addEventListener('scroll', on, { passive: true }); addEventListener('resize', on, { passive: true }); tick();
}

/* 3. "30" scroll film: big video numerals, word swap driven by scroll, then a zoom through the 0 into the video */
function y30Init(el) {
  const sec = el.querySelector('.y30'), m = el.querySelector('.y30m'), n = el.querySelector('.y30n'), z = el.querySelector('.y30n .z'),
    sub = el.querySelector('.y30sub'), sw = el.querySelector('.y30sub .swap span'), cap = el.querySelector('.y30cap'), v = el.querySelector('video'), hint = el.querySelector('.y30hint'), dim = el.querySelector('.y30dim');
  if (!sec) return;
  if (RM) { sec.classList.add('still'); return; }
  let raf = 0, k = -1, oset = false;
  /* zoom target = the middle of the left stroke of the "0", measured from the real glyph on a canvas, so we always dive into video, not into white */
  const origin = () => { const fs = parseFloat(getComputedStyle(n).fontSize); if (!fs) return;
    const c = document.createElement('canvas'), W = Math.ceil(fs * 1.3), x = c.getContext('2d'); c.width = W; c.height = W;
    x.font = `800 ${fs}px "Inter Tight"`; x.textBaseline = 'alphabetic'; x.fillText('0', 0, fs); const mt = x.measureText('0'), asc = mt.actualBoundingBoxAscent || fs * .72;
    const row = Math.round(fs - asc / 2), d = x.getImageData(0, row, W, 1).data; let a = -1, b = -1; for (let i = 0; i < W; i++) { if (d[i * 4 + 3] > 128) { if (a < 0) a = i; b = i; } else if (a >= 0) break; }
    const sx = a >= 0 ? (a + b) / 2 : fs * .12; const zr = z.getBoundingClientRect(), mr = m.getBoundingClientRect(), base = n.querySelector('.bl').getBoundingClientRect().top;
    m.style.transformOrigin = `${(zr.left - mr.left + sx).toFixed(1)}px ${(base - mr.top - asc / 2).toFixed(1)}px`; oset = true; };
  const tick = () => { raf = 0; if (!document.body.contains(sec)) return removeEventListener('scroll', on);
    const r = sec.getBoundingClientRect(), span = r.height - innerHeight, p = clamp01(-r.top / span);
    const intro = clamp01(p / .12), zt = clamp01((p - .36) / .34), fade = clamp01((p - .64) / .1), capP = clamp01((p - .72) / .14);
    n.style.transform = `scale(${(.9 + .1 * ease(intro)).toFixed(4)})`;
    if (zt === 0 || !oset) origin();
    const s = zt > 0 ? Math.exp(Math.log(70) * ease(zt)) : 1;
    m.style.transform = `scale(${s.toFixed(4)})`; m.style.opacity = (1 - fade).toFixed(3);
    sub.style.opacity = (1 - clamp01((p - .31) / .06)).toFixed(3); sub.style.transform = `translateY(${(-24 * clamp01((p - .31) / .06)).toFixed(1)}px)`;
    const w = p < .08 ? 0 : p < .18 ? 1 : 2; if (w !== k) { k = w; sw.style.transform = `translateY(${-w * 33.333}%)`; }
    cap.style.opacity = capP.toFixed(3); cap.style.transform = `translateY(${(1 - ease(capP)) * 30}px)`;
    v.style.transform = `scale(${(1.12 - .12 * ease(clamp01((p - .4) / .5))).toFixed(4)})`;
    if (dim) dim.style.opacity = (1 - clamp01((p - .45) / .2)).toFixed(3);
    if (hint) hint.style.opacity = (1 - clamp01(p / .04)).toFixed(2); };
  const on = () => { if (!raf) raf = requestAnimationFrame(tick); };
  addEventListener('scroll', on, { passive: true }); addEventListener('resize', () => { oset = false; on(); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { oset = false; tick(); });
  tick();
}

/* 4. swipe rows with dots + optional arrows (reviews, team, tech on phones) */
function railInit(el, sel) {
  const row = el.querySelector(sel); if (!row) return; const cs = [...row.children], dots = el.querySelector('.dots'), prev = el.querySelector('.rprev'), next = el.querySelector('.rnext');
  const go = i => { i = Math.max(0, Math.min(cs.length - 1, i)); row.scrollTo({ left: cs[i].offsetLeft - row.offsetLeft - parseFloat(getComputedStyle(row).scrollPaddingLeft || 0), behavior: RM ? 'auto' : 'smooth' }); };
  let cur = 0;
  if (dots) { dots.innerHTML = cs.map((_, i) => `<button type="button" aria-label="Go to ${i + 1} of ${cs.length}"></button>`).join(''); [...dots.children].forEach((d, i) => d.addEventListener('click', () => go(i))); }
  const mark = () => { const c = row.scrollLeft + row.clientWidth / 2; let k = 0, m = 1e9; cs.forEach((x, i) => { const d = Math.abs(x.offsetLeft - row.offsetLeft + x.offsetWidth / 2 - c); if (d < m) { m = d; k = i; } });
    if (row.scrollLeft < 8) k = 0; if (row.scrollLeft + row.clientWidth > row.scrollWidth - 8) k = cs.length - 1; cur = k;
    if (dots) [...dots.children].forEach((d, i) => d.setAttribute('aria-current', String(i === k)));
    if (prev) prev.disabled = row.scrollLeft < 8; if (next) next.disabled = row.scrollLeft + row.clientWidth > row.scrollWidth - 8; };
  if (prev) prev.addEventListener('click', () => go(cur - 1)); if (next) next.addEventListener('click', () => go(cur + 1));
  row.addEventListener('scroll', () => requestAnimationFrame(mark), { passive: true }); addEventListener('resize', mark); mark();
}

/* 5. offer pop-up: after 60 seconds on the page, once per visit, never over the form or while typing */
const OFFER_FORM = id => `<form class="form pform" novalidate onsubmit="event.preventDefault();this.querySelector('.ok').hidden=false;try{sessionStorage.setItem('ald-offer','sent')}catch(e){}">
  <div class="r2"><label for="${id}n">First name<input id="${id}n" autocomplete="given-name"></label><label for="${id}p">Mobile phone<input id="${id}p" type="tel" inputmode="tel" autocomplete="tel"></label></div>
  <label for="${id}i">What are you interested in?<select id="${id}i"><option>Veneers</option><option>Whitening</option><option>Clear aligners</option><option>Dental implants</option><option>Crowns</option><option>A cleaning</option><option>Not sure yet</option></select></label>
  <label class="ck" for="${id}s"><input id="${id}s" type="checkbox"><span>I agree to receive text messages from Austin Lifetime Dental LLLP about my appointment request. Msg frequency varies. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help.</span></label>
  <button class="btn b-gold" type="submit">Claim my free consult</button><p class="ok fine" hidden>Draft only: the form is not connected yet.</p></form>`;
function openOffer() {
  if (document.querySelector('.pop')) return;
  const last = document.activeElement, d = document.createElement('div'); d.className = 'pop'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'popt');
  d.innerHTML = `<div class="pbox" tabindex="-1"><button type="button" class="px" aria-label="Close">×</button>
    <div class="ptop"><p class="eb">(Parmer Lane offer)</p><h3 id="popt">Your consultation is free.</h3><p class="pof"><b>First visit?</b> Take 50% off your first cleaning.</p><p class="pq">“With 30 years of experience, we know how to deliver long-lasting cosmetic results that match your look and personality. Talk to our doctors about what we can do for you.”</p></div>${OFFER_FORM('pp')}</div>`;
  const close = () => { document.documentElement.classList.remove('poplock'); d.classList.remove('on'); setTimeout(() => d.remove(), 320); document.removeEventListener('keydown', key); if (last && last.focus) last.focus(); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'Tab') { const f = [...d.querySelectorAll('button,input,select,a')].filter(x => !x.hidden && x.offsetParent); if (!f.length) return; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i < 0 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); } } };
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('.px')) close(); }); document.addEventListener('keydown', key);
  document.body.appendChild(d); document.documentElement.classList.add('poplock'); requestAnimationFrame(() => { d.classList.add('on'); d.querySelector('.pbox').focus({ preventScroll: true }); });
  try { sessionStorage.setItem('ald-offer', 'shown'); } catch (e) {}
}
function popupInit(ms = 60000, force = false) {
  document.addEventListener('click', e => { const a = e.target.closest('[data-offer]'); if (a) { e.preventDefault(); openOffer(); } });
  let seen = null; try { seen = sessionStorage.getItem('ald-offer'); } catch (e) {}
  if (seen && !force) return;
  let typed = false; document.addEventListener('input', e => { if (e.target.closest('.form')) typed = true; });
  const tryOpen = () => { const f = document.querySelector('#pk-form'); const r = f && f.getBoundingClientRect(); const formVisible = r && r.top < innerHeight && r.bottom > 0;
    if (typed || formVisible || document.querySelector('.lb,.pop') || document.hidden) return setTimeout(tryOpen, 8000); openOffer(); };
  setTimeout(tryOpen, ms);
}

/* 6. floating book/call buttons step aside while the hero or the closing form is on screen */
function fabInit() {
  const fab = document.querySelector('.fab'); if (!fab || !('IntersectionObserver' in window)) return;
  const seen = new Set(); const io = new IntersectionObserver(es => { es.forEach(e => e.isIntersecting ? seen.add(e.target) : seen.delete(e.target)); fab.classList.toggle('away', seen.size > 0); }, { threshold: .15 });
  ['#pk-hero', '#pk-form'].forEach(s => { const e = document.querySelector(s); if (e) io.observe(e); });
}

/* Picker core: renders sections, switches options, saves picks to the artifact db */
const SECTIONS = [...S1, ...S2, ...S3];
SECTIONS.forEach(s => { s.v = s.v.filter(v => !v.hide); });
const TONES = { a: ['Light capitals', 'IGOR'], b: ['Bold two-tone capitals', 'OperatorX'], c: ['Tight lowercase, one hand-written word', 'Monoform'] };
const REFS = [
  ['IGOR', 'Services as square photo tiles with capital labels (Services 1), the “About” block (Team 2), tone A.'],
  ['Monōform', 'My suggestion: use it for the process cards with big 01–04 (Process 2), the numbered service rows (Services 3), the big numbers (30 years 3) and tone C.'],
  ['Halvor', 'The globe of smiles (Results 2). We have 15 before/after cases, enough to fill it.'],
  ['OperatorX', 'The hero with big two-tone type (Hero 1), the sentence that lights up (30 years 2), dark stacking cards (Services 2), tone B.'],
  ['LiquidGlass FlipCard', 'Technology cards that flip (Technology 1), doctor cards (Team 1), glass info cards (Cost 2, Visit 3).'],
  ['DNA Carousel', 'The helix of results (Results 1).'],
  ['Text Video Mask', '“30 Years of Smiles” with footage inside the letters (Hero 2), the word swap (30 years 1), the closing tagline (Form 2).'],
  ['Neural Brain', 'The point-cloud smile you can reshape with sliders (Smile designer 1).'],
  ['Adaptive Pill Navbar', 'The floating pill menu (Navigation 1).'],
];
const $ = (s, r = document) => r.querySelector(s);
let ST = { tone: 'b', picks: {}, notes: {}, updated: null }, VIEW = {}, ref = null, saveT = null;

function build() {
  $('#app').innerHTML = `
  <div class="top in">
    <p class="lab">Austin Lifetime Dental · PMax landing page · round 2</p>
    <h1>Pick one option for each section</h1>
    <p class="hidep">Built from your nine references. All 42 options share one look, so any mix works together. Tap 1, 2 or 3 to compare, the number you leave selected is your pick. Picks and notes reach me on their own.</p>
    <details class="hidep" style="margin-top:14px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Where each of your references is used</summary>
      <div style="display:grid;gap:8px;margin-top:10px;font-size:14px;color:var(--mute);max-width:80ch">${REFS.map(r => `<div><b style="color:var(--ink)">${r[0]}:</b> ${r[1]}</div>`).join('')}</div></details>
    <div class="hidep" style="margin-top:22px"><p class="lab" style="margin:0 0 8px">Overall type style (changes every section)</p>
      <div class="seg" id="tone" style="display:inline-flex;flex-wrap:wrap;border-radius:18px">${Object.entries(TONES).map(([k, v]) => `<button type="button" data-t="${k}" style="padding:9px 14px">${v[0]} <span style="color:var(--mute);font-weight:500">· ${v[1]}</span></button>`).join('')}</div></div>
    <div class="status"><span id="prog">0 of ${SECTIONS.length} picked</span><div class="meter"><i id="bar"></i></div><span id="sync">Connecting…</span>
      <button class="tog" id="prev" type="button" aria-pressed="false">Preview my picks as one page</button></div>
  </div>
  ${SECTIONS.map((s, i) => `<section class="pk" id="pk-${s.id}" aria-label="${s.name}">
    <div class="pk-bar"><div class="in"><span class="lab">${String(i + 1).padStart(2, '0')}</span><b>${s.name}</b><span class="ref">from ${s.ref}</span>
      <div class="seg" role="group" aria-label="${s.name} options">${s.v.map((v, k) => v.hide ? '' : `<button type="button" data-s="${s.id}" data-k="${k}">${k + 1}</button>`).join('')}</div>
      <button type="button" class="pickb" data-pick="${s.id}" aria-pressed="false">Pick</button></div></div>
    <div class="stage" id="st-${s.id}"></div>
    <div class="pk-foot"><div class="in"><span class="vn" id="vn-${s.id}"></span><span class="vd" id="vd-${s.id}"></span><input id="nt-${s.id}" aria-label="Note for ${s.name}" placeholder="Note for Claude (optional)"></div></div>
  </section>`).join('')}
  <div class="in" style="padding-block:40px 90px"><p class="lab">Anything else</p><input id="nt-free" aria-label="General note" placeholder="For example: mix Hero 1 photo with Hero 2 letters" style="width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink);margin-top:8px"></div>`;
  SECTIONS.forEach(s => show(s.id, ST.picks[s.id] ? ST.picks[s.id] - 1 : 0));
  document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { ST.picks[b.dataset.s] = +b.dataset.k + 1; show(b.dataset.s, +b.dataset.k); save(); }));
  document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.pick, k = VIEW[id] + 1; ST.picks[id] = ST.picks[id] === k ? null : k; paint(); save(); }));
  document.querySelectorAll('#tone button').forEach(b => b.addEventListener('click', () => { ST.tone = b.dataset.t; paint(); save(); }));
  SECTIONS.forEach(s => $('#nt-' + s.id).addEventListener('input', e => { ST.notes[s.id] = e.target.value; save(); }));
  $('#nt-free').addEventListener('input', e => { ST.notes.free = e.target.value; save(); });
  $('#prev').addEventListener('click', () => { const on = !document.body.classList.contains('preview'); document.body.classList.toggle('preview', on); $('#prev').setAttribute('aria-pressed', String(on)); $('#prev').textContent = on ? 'Back to the picker' : 'Preview my picks as one page'; if (on) { SECTIONS.forEach(s => { if (ST.picks[s.id] && VIEW[s.id] !== ST.picks[s.id] - 1) show(s.id, ST.picks[s.id] - 1); }); scrollTo(0, 0); } });
  paint();
}
function show(id, k) {
  const s = SECTIONS.find(x => x.id === id), v = s.v[k], st = $('#st-' + id); VIEW[id] = k;
  st.innerHTML = v.html(); if (v.init) { try { v.init(st); } catch (e) { console.error(id, k, e); } }
  $('#vn-' + id).textContent = (k + 1) + ' · ' + v.name; $('#vd-' + id).textContent = v.d; paint();
}
function paint() {
  document.body.classList.remove('tone-a', 'tone-b', 'tone-c'); document.body.classList.add('tone-' + ST.tone);
  document.querySelectorAll('#tone button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === ST.tone)));
  let n = 0; SECTIONS.forEach(s => { const p = ST.picks[s.id]; if (p) n++;
    document.querySelectorAll(`[data-s="${s.id}"]`).forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.k === VIEW[s.id])); b.classList.toggle('picked', p === +b.dataset.k + 1); });
    const pb = $(`[data-pick="${s.id}"]`); const on = p === VIEW[s.id] + 1; pb.setAttribute('aria-pressed', String(on)); pb.textContent = on ? 'Picked ✓' : 'Pick';
    const t = $('#nt-' + s.id); if (document.activeElement !== t) t.value = ST.notes[s.id] || ''; });
  const f = $('#nt-free'); if (f && document.activeElement !== f) f.value = ST.notes.free || '';
  $('#prog').textContent = n + ' of ' + SECTIONS.length + ' picked'; $('#bar').style.width = (100 * n / SECTIONS.length) + '%';
}
function save() {
  try { localStorage.setItem('ald-picker2', JSON.stringify(ST)); } catch (e) {}
  if (!ref) { $('#sync').textContent = 'Saved on this device only'; return; }
  clearTimeout(saveT); $('#sync').textContent = 'Saving…';
  saveT = setTimeout(async () => { ST.updated = new Date().toISOString(); try { await ref.set(JSON.parse(JSON.stringify(ST))); $('#sync').textContent = '☁️ Synced to Claude'; } catch (e) { $('#sync').textContent = 'Not synced, saved on this device'; } }, 700);
}
ST.tone='c'; ST.picks={"nav": 2, "hero": 1, "offer1": 1, "offer2": 1, "years": 1, "services": 2, "designer": 1, "process": 1, "results": 3, "tech": 1, "team": 1, "cost": 2, "reviews": 2, "visit": 1, "faq": 3, "form": 1}; const FINAL=true;
build(); document.body.classList.add('preview','final'); document.querySelector('.top').hidden=true; revealInit(); fabInit(); popupInit(/[?&#]popup-test/.test(location.href) ? 1500 : 60000, /[?&#]popup-test/.test(location.href));
(async () => {
  let db = null; try { db = window.claude ? await window.claude.use('db') : null; } catch (e) {}
  if (!db) { $('#sync').textContent = 'Saved on this device only'; return; }
  ref = db.doc('final/notes'); return; let first = true; const timer = setTimeout(() => { if (first) $('#sync').textContent = 'Sync slow, saving on this device'; }, 10000);
  ref.onSnapshot(snap => { clearTimeout(timer); if (snap.exists && first) { const d = JSON.parse(JSON.stringify(snap.data())); ST = { tone: d.tone || ST.tone, picks: Object.assign({}, ST.picks, d.picks || {}), notes: Object.assign({}, ST.notes, d.notes || {}), updated: d.updated || null }; SECTIONS.forEach(s => { if (ST.picks[s.id]) show(s.id, ST.picks[s.id] - 1); }); paint(); }
    if (first) { first = false; $('#sync').textContent = snap.exists ? '☁️ Synced to Claude' : '☁️ Ready'; } }, () => { clearTimeout(timer); $('#sync').textContent = 'Sync off, saved on this device'; });
})();

</script>
